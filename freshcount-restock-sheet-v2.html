<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FreshCount — Restock Sheet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- V1 identity: Poppins, carried forward -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1830;            /* dark indigo-tinted charcoal — brand nod + low glare */
    --panel:#12101f;
    --card:#f6f4ef;          /* laminate white */
    --card-line:#e3ddce;
    --ink:#171512;
    --ink-soft:#6b6357;
    --indigo:#5B2CFF;        /* V1 brand */
    --indigo-deep:#4520cc;   /* V1 hover, reused for depth */
    --green:#2f8f4e;
    --green-deep:#236e3c;
    --steel:#2a2740;
    --steel-line:#3a3556;
  }
  html,body{height:100%}
  body{
    background:var(--bg);
    font-family:'Poppins',system-ui,sans-serif;
    color:#eef0f2;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    overscroll-behavior:none;
  }
  .num{font-variant-numeric:tabular-nums;}

  /* category tabs */
  .tab{font-weight:600;letter-spacing:.01em;}
  .tab[aria-selected="true"]{background:var(--indigo);color:#fff;box-shadow:0 4px 0 var(--indigo-deep);}
  .tab[aria-selected="false"]{background:var(--steel);color:#c7ccd3;box-shadow:0 4px 0 #0d0b16;}
  .tab:active{transform:translateY(2px);}

  /* search */
  .search{
    background:var(--steel);border:1px solid var(--steel-line);color:#fff;
    font-family:'Poppins',sans-serif;
  }
  .search::placeholder{color:#8b8fb0;}
  .search:focus{border-color:var(--indigo);outline:none;}

  /* item card */
  .card{
    background:var(--card);color:var(--ink);
    border:1px solid var(--card-line);border-radius:20px;
    position:relative;overflow:hidden;
    box-shadow:0 6px 0 rgba(0,0,0,.30);
  }
  .card[data-active="true"]{box-shadow:0 6px 0 var(--indigo-deep),0 0 0 3px var(--indigo) inset;}
  .card[data-active="true"]::before{
    content:"";position:absolute;top:0;right:0;
    border-width:0 46px 46px 0;border-style:solid;
    border-color:transparent var(--indigo) transparent transparent;
  }
  .card[data-active="true"]::after{
    content:"ON ORDER";position:absolute;top:7px;right:3px;
    transform:rotate(45deg);font-weight:700;
    font-size:9px;letter-spacing:.05em;color:#fff;
  }

  /* usually-needed flag — repurposed low-stock alert */
  .usual{background:#ece6ff;color:var(--indigo-deep);border:1px solid #d6caff;}

  /* giant counter buttons */
  .step{
    width:92px;height:92px;border-radius:18px;flex:none;
    display:flex;align-items:center;justify-content:center;
    color:#fff;touch-action:manipulation;
  }
  .step svg{width:40px;height:40px;}
  .minus{background:#8a8378;box-shadow:0 5px 0 #6a6459;}
  .plus{background:var(--green);box-shadow:0 5px 0 var(--green-deep);}
  .step:active{transform:translateY(3px);}
  .minus:disabled{opacity:.35;}
  .minus:disabled:active{transform:none;}

  .count{font-weight:700;font-variant-numeric:tabular-nums;}
  .count[data-on="true"]{color:var(--indigo);}
  .count[data-on="false"]{color:#c3bcae;}

  .supplier{background:#efe8d8;color:var(--ink-soft);border:1px solid var(--card-line);}

  .compile{
    background:var(--indigo);color:#fff;box-shadow:0 6px 0 var(--indigo-deep);
    font-weight:600;letter-spacing:.02em;
  }
  .compile:active{transform:translateY(3px);box-shadow:0 3px 0 var(--indigo-deep);}
  .compile:disabled{background:#413d5c;box-shadow:0 6px 0 #2a2740;color:#9aa1aa;}
  .compile:disabled:active{transform:none;box-shadow:0 6px 0 #2a2740;}

  .empty{color:#8b8fb0;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  .pagelink{background:var(--steel);color:#c7ccd3;border:1px solid var(--steel-line);
    font-weight:600;border-radius:10px;padding:10px 16px;font-size:14px;line-height:1;white-space:nowrap;}
  .pagelink[aria-current="page"]{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .pagelink:active{transform:translateY(1px);}
  :focus-visible{outline:3px solid #b9a5ff;outline-offset:2px;}
</style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top bar -->
  <header class="bg-[var(--panel)] border-b border-[var(--steel-line)] px-5 pt-4 pb-3">
    <div class="flex items-center justify-between gap-4">
      <a href="freshcount-home.html" class="flex-none">
        <div class="font-bold text-2xl leading-none">
          <span style="color:var(--indigo)">Fresh</span>Count
        </div>
        <div class="text-[13px] text-[#9aa1aa] mt-1">Hao Wei · Kitchen restock</div>
      </a>
      <nav class="flex items-center gap-2 overflow-x-auto" aria-label="Pages">
        <a href="freshcount-home.html" class="pagelink">Home</a>
        <a href="freshcount-restock-sheet-v2.html" class="pagelink" aria-current="page">Restock</a>
        <a href="freshcount-review.html" class="pagelink">Review</a>
      </nav>
      <div class="text-right leading-tight flex-none">
        <div class="num text-xl font-semibold" id="today">Tue 21 Jul</div>
        <div class="text-[13px] text-[#9aa1aa]">Tap what needs ordering</div>
      </div>
    </div>

    <!-- Category tabs -->
    <nav class="mt-4 flex gap-2 overflow-x-auto pb-1 -mx-1 px-1" aria-label="Categories">
      <button class="tab rounded-xl px-5 py-3 text-lg whitespace-nowrap" data-cat="Meat &amp; Seafood"
        aria-selected="true">Meat &amp; Seafood</button>
      <button class="tab rounded-xl px-5 py-3 text-lg whitespace-nowrap" data-cat="Vegetables &amp; Fresh Produce"
        aria-selected="false">Vegetables &amp; Fresh Produce</button>
      <button class="tab rounded-xl px-5 py-3 text-lg whitespace-nowrap" data-cat="Prepared Frozen Items"
        aria-selected="false">Prepared Frozen Items</button>
      <button class="tab rounded-xl px-5 py-3 text-lg whitespace-nowrap" data-cat="Noodles &amp; Rice"
        aria-selected="false">Noodles &amp; Rice</button>
      <button class="tab rounded-xl px-5 py-3 text-lg whitespace-nowrap" data-cat="Canned &amp; Jarred Goods"
        aria-selected="false">Canned &amp; Jarred Goods</button>
      <button class="tab rounded-xl px-5 py-3 text-lg whitespace-nowrap" data-cat="Spices &amp; Seasonings"
        aria-selected="false">Spices &amp; Seasonings</button>
      <button class="tab rounded-xl px-5 py-3 text-lg whitespace-nowrap" data-cat="Sauces &amp; Condiments"
        aria-selected="false">Sauces &amp; Condiments</button>
      <button class="tab rounded-xl px-5 py-3 text-lg whitespace-nowrap" data-cat="Colouring &amp; Additives"
        aria-selected="false">Colouring &amp; Additives</button>
      <button class="tab rounded-xl px-5 py-3 text-lg whitespace-nowrap" data-cat="Flour &amp; Baking"
        aria-selected="false">Flour &amp; Baking</button>
      <button class="tab rounded-xl px-5 py-3 text-lg whitespace-nowrap" data-cat="Packaging"
        aria-selected="false">Packaging</button>
      <button class="tab rounded-xl px-5 py-3 text-lg whitespace-nowrap" data-cat="Cleaning Supplies"
        aria-selected="false">Cleaning Supplies</button>
    </nav>

    <!-- Search — V1 feature, now a live filter -->
    <div class="mt-3 relative">
      <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[#8b8fb0]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" class="search w-full rounded-xl pl-12 pr-11 py-3 text-lg" type="text" placeholder="Search this category…" autocomplete="off" />
      <button id="clear" class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-lg bg-[var(--steel-line)] text-white text-xl leading-none hidden" aria-label="Clear search">×</button>
    </div>
  </header>

  <!-- Item grid -->
  <main class="flex-1 px-4 py-5 pb-40">
    <div id="grid" class="grid gap-4 max-w-6xl mx-auto"
         style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr));"></div>
    <p id="noResults" class="empty text-center text-lg mt-10 hidden">No items match that search.</p>
  </main>

  <!-- Compile bar -->
  <footer class="fixed bottom-0 inset-x-0 bg-[var(--panel)] border-t border-[var(--steel-line)] px-5 py-4"
          style="padding-bottom:calc(1rem + env(safe-area-inset-bottom));">
    <div class="max-w-6xl mx-auto flex items-center gap-4">
      <div class="flex-1">
        <div class="text-2xl font-bold leading-none"><span id="lineCount" style="color:var(--indigo)">0</span> lines to order</div>
        <div class="text-[13px] text-[#9aa1aa] mt-1" id="subline">Nothing marked yet</div>
      </div>
      <button id="compile" class="compile rounded-2xl px-7 py-5 text-xl" disabled>Compile order</button>
    </div>
  </footer>

  <script>
  // Catalog — items grouped by category. Swap in your real 89 items the same way.
 const catalog = {
    "Meat & Seafood": [
      { name: "Chicken breast (TDH)", supplier: "Booker" },

      { name: "Garlic flake", supplier: "Booker" },

      { name: "Peas", supplier: "Booker" },
      { name: "Pak choi", supplier: "Bath Wholesale" },
      { name: "Spring onion (big heads)", supplier: "Bath Wholesale" },
      { name: "Large onions", supplier: "Bath Wholesale" },
      { name: "Green peppers", supplier: "Bath Wholesale" },
      { name: "Mushrooms", supplier: "Bath Wholesale" },
      { name: "Carrots", supplier: "Bath Wholesale" },
      { name: "Cucumber", supplier: "Bath Wholesale" },
      { name: "Chinese leaf", supplier: "Bath Wholesale" },
      { name: "Red chilli", supplier: "Bath Wholesale" },
      { name: "Broccoli", supplier: "Bath Wholesale" },
      { name: "Oranges", supplier: "Bath Wholesale" },
      { name: "Lemons", supplier: "Bath Wholesale" },
      { name: "Peeled garlic", supplier: "Makro" },
    ],
    "Prepared Frozen Items": [
      { name: "Pork gyoza", supplier: "Wai Yee Hong" },
      { name: "Veg gyoza", supplier: "Wai Yee Hong" },
      { name: "Chicken gyoza", supplier: "Wai Yee Hong" },
      { name: "Veg spring roll", supplier: "Wai Yee Hong" },

    "Noodles & Rice": [

    ],
    "Canned & Jarred Goods": [

      { name: "Lychees", supplier: ["Booker", "Wai Yee Hong"] },

    ],
    "Spices & Seasonings": [
      { name: "MSG (L)", supplier: "Wai Yee Hong" },

      { name: "Ground white pepper", supplier: ["Booker", "Wai Yee Hong"] },
      { name: "White sugar", supplier: "Booker" },

    ],
    "Sauces & Condiments": [
      { name: "Black bean", supplier: "Wai Yee Hong" },

      { name: "Sesame oil (L)", supplier: "Wai Yee Hong" },
      { name: "White vinegar", supplier: "Booker" },
      { name: "Brown vinegar (5L)", supplier: "Booker" },
      { name: "Coconut milk", supplier: "Wai Yee Hong" },
      { name: "Coconut cream", supplier: "Wai Yee Hong" },
      { name: "Jimmy satay sauce", supplier: ["Booker", "Wai Yee Hong"] },
      { name: "Hoi sin sauce", supplier: "Wai Yee Hong" },
      { name: "Yellow bean sauce", supplier: "Wai Yee Hong" },
      { name: "Hot bean sauce YEO", supplier: "Wai Yee Hong" },
      { name: "Worcester sauce", supplier: "Booker" },

      { name: "Oyster sauce (gf)", supplier: "Wai Yee Hong" },
      { name: "HP", supplier: "Booker" },
      { name: "Ketchup", supplier: "Booker" },
      { name: "Light soy sauce", supplier: "Wai Yee Hong" },

      { name: "Dark soy sauce", supplier: "Wai Yee Hong" },
      { name: "Satay sticks box (Binch)", supplier: "Booker" },
      { name: "Cooking oil", supplier: "Makro" },
      { name: "Salad cream", supplier: "Makro" },
    ],
    "Colouring & Additives": [
      { name: "Orange food colouring", supplier: "Booker" },
      { name: "Yellow food colouring", supplier: "Booker" },
      { name: "Red food colouring", supplier: ["Booker", "Wai Yee Hong"] },
    ],
    "Flour & Baking": [
      { name: "Corn flour", supplier: "Booker" },
      { name: "Self-raising flour", supplier: "Booker" },
      { name: "Potato starch", supplier: "Wai Yee Hong" },
    ],
    "Packaging": [
      { name: "No 2 container (QTY 1000)", supplier: "Booker" },
      { name: "M12 SATCO", supplier: "Booker" },
      { name: "Packit 500", supplier: "Booker" },
      { name: "Packit 650", supplier: "Booker" },
      { name: "4 oz (clear cup Satso)", supplier: "Booker" },
      { name: "7 oz (clear cup Satso)", supplier: "Booker" },
      { name: "Greaseproof bags (10x10)", supplier: "Booker" },
      { name: "Greaseproof bags (7x7)", supplier: "Booker" },
      { name: "White counter bags (10x12)", supplier: "Booker" },
    ],
    "Cleaning Supplies": [
      { name: "Scouring pads (thick)", supplier: "Booker" },
      { name: "Fairy washing up liquid 5L", supplier: "Makro" },
    ],
  };

  const minusIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M5 12h14"/></svg>';
  const plusIcon  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

  const grid    = document.getElementById('grid');
  const tabs    = [...document.querySelectorAll('.tab')];
  const searchEl= document.getElementById('search');
  const clearEl = document.getElementById('clear');

  // Quantities persist across tabs, keyed by category|name — so an order spans categories.
  const qty = new Map();
  const keyOf = (cat, name) => cat + '|' + name;
  let currentCat = tabs[0].dataset.cat;

  function daysAgo(iso){
    const d = Math.round((Date.now() - new Date(iso)) / 86400000);
    if (d <= 0) return "today";
    if (d === 1) return "yesterday";
    if (d < 14) return d + " days ago";
    return Math.floor(d/7) + " weeks ago";
  }

  function cardHTML(cat, it) {
      const key = keyOf(cat, it.name);
      const q = qty.get(key) || 0;
      const meta = [];
      if (it.unit) meta.push(`<span class="text-[14px] text-[var(--ink-soft)]">${it.unit}</span>`);
      if (it.usual) meta.push('<span class="usual text-[11px] font-semibold rounded-full px-2 py-0.5">Usually needed</span>');
      const metaRow = meta.length ? `<div class="flex items-center gap-2 mt-1">${meta.join('')}</div>` : '';
      const lastRow = it.last ? `<span class="text-[12px] text-[var(--ink-soft)]">Last ordered ${daysAgo(it.last)}</span>` : '<span></span>';
      const suppliers = Array.isArray(it.supplier) ? it.supplier : [it.supplier];
      const supplierChips = suppliers.map(s =>
        `<span class="supplier text-[12px] font-medium rounded-full px-2.5 py-1">${s}</span>`
      ).join('');
      return `
      <div class="card p-4 flex flex-col gap-3" data-active="${q > 0 ? 'true' : 'false'}" data-name="${it.name.toLowerCase()}" data-key="${key}">
        <div class="pr-8">
          <div class="font-semibold text-xl leading-tight">${it.name}</div>
          ${metaRow}
        </div>
        <div class="flex items-center justify-between gap-3">
          <button class="step minus" aria-label="Remove one ${it.name}" data-act="dec" ${q === 0 ? 'disabled' : ''}>${minusIcon}</button>
          <div class="count text-6xl leading-none" data-on="${q > 0 ? 'true' : 'false'}" aria-live="polite">${q}</div>
          <button class="step plus" aria-label="Add one ${it.name}" data-act="inc">${plusIcon}</button>
        </div>
        <div class="flex items-center justify-between gap-2 pt-1 border-t border-[var(--card-line)]">
          <div class="flex flex-wrap items-center gap-1.5">${supplierChips}</div>
          ${lastRow}
        </div>
      </div>`;
    }

  function renderGrid(){
    grid.innerHTML = (catalog[currentCat] || []).map(it => cardHTML(currentCat, it)).join('');
    applySearch();
  }

  function updateBar(){
    let lines = 0, units = 0;
    qty.forEach(q => { if (q > 0) { lines++; units += q; } });
    document.getElementById('lineCount').textContent = lines;
    document.getElementById('subline').textContent = lines === 0
      ? 'Nothing marked yet'
      : `${units} unit${units!==1?'s':''} across ${lines} item${lines!==1?'s':''}`;
    document.getElementById('compile').disabled = lines === 0;
  }

  grid.addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if(!btn) return;
    const card = btn.closest('.card');
    const key = card.dataset.key;
    let q = qty.get(key) || 0;
    q = btn.dataset.act === 'inc' ? q + 1 : Math.max(0, q - 1);
    qty.set(key, q);
    card.dataset.active = q > 0 ? 'true' : 'false';
    const countEl = card.querySelector('.count');
    countEl.textContent = q;
    countEl.dataset.on = q > 0 ? 'true' : 'false';
    card.querySelector('.minus').disabled = q === 0;
    updateBar();
  });

  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.setAttribute('aria-selected', t === tab ? 'true' : 'false'));
    currentCat = tab.dataset.cat;
    searchEl.value = ''; clearEl.classList.add('hidden');
    renderGrid();
  }));

  function applySearch(){
    const q = searchEl.value.trim().toLowerCase();
    clearEl.classList.toggle('hidden', q === '');
    let shown = 0;
    [...grid.children].forEach(card => {
      const match = card.dataset.name.includes(q);
      card.style.display = match ? '' : 'none';
      if (match) shown++;
    });
    document.getElementById('noResults').classList.toggle('hidden', shown > 0);
  }
  searchEl.addEventListener('input', applySearch);
  clearEl.addEventListener('click', () => { searchEl.value=''; applySearch(); searchEl.focus(); });

  document.getElementById('compile').addEventListener('click', () => {
    window.location.href = 'freshcount-review.html';
  });

  document.getElementById('today').textContent =
    new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

  renderGrid();
</script>
</body>
</html>
